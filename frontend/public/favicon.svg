<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Skill tree branching upward - growth and progression -->
  <defs>
    <linearGradient id="treeGradient" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Main trunk -->
  <path
    d="M24 44 L24 28"
    stroke="url(#treeGradient)"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Left branch -->
  <path
    d="M24 28 Q20 24 14 18"
    stroke="url(#treeGradient)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Right branch -->
  <path
    d="M24 28 Q28 24 34 18"
    stroke="url(#treeGradient)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Center branch going up -->
  <path
    d="M24 28 L24 14"
    stroke="url(#treeGradient)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Skill nodes (circles at branch ends) -->
  <circle cx="14" cy="18" r="4" fill="#3B82F6"/>
  <circle cx="14" cy="18" r="2" fill="#DBEAFE"/>

  <circle cx="24" cy="14" r="4" fill="#3B82F6"/>
  <circle cx="24" cy="14" r="2" fill="#DBEAFE"/>

  <circle cx="34" cy="18" r="4" fill="#3B82F6"/>
  <circle cx="34" cy="18" r="2" fill="#DBEAFE"/>

  <!-- Sub-branches from left node -->
  <path d="M14 18 Q10 14 8 10" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="8" cy="10" r="2.5" fill="#60A5FA"/>

  <!-- Sub-branches from center node -->
  <path d="M24 14 L24 6" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="6" r="2.5" fill="#60A5FA"/>

  <!-- Sub-branches from right node -->
  <path d="M34 18 Q38 14 40 10" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="40" cy="10" r="2.5" fill="#60A5FA"/>
</svg>
