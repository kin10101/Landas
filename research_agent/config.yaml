research_agent:
  enabled_sources:
    hackernews: true
    github_trending: true
    devto: true
    medium: true
    arxiv: true
    stackoverflow: true
    pypi: true

  target_roles:
    - "Data Engineer"
    - "AI Engineer"
    - "ML Engineer"
    - "Analytics Engineer"

  keywords:
    data_tech:
      - dbt
      - Apache Spark
      - pandas
      - SQL
      - Snowflake
      - BigQuery
      - Delta Lake
      - Polars
      - DuckDB
      - Airflow
      - Kafka
      - Presto
      - Ray

    ai_tech:
      - LLMs
      - RAG
      - Vector Databases
      - Transformers
      - PyTorch
      - TensorFlow
      - JAX
      - Anthropic
      - OpenAI
      - Hugging Face
      - MLflow
      - Weights & Biases
      - LangChain
      - LlamaIndex
      - vLLM
      - Ollama

  update_frequency: "weekly"  # or "manual"
  schedule_time: "07:00"      # UTC

  # Dev.to tags to monitor
  devto_tags:
    - "machinelearning"
    - "dataengineering"
    - "python"
    - "ai"
    - "llm"

  # ArXiv categories to monitor
  arxiv_categories:
    - "cs.AI"
    - "cs.LG"
    - "stat.ML"

  # Limits for API calls
  api_limits:
    hackernews_stories: 30
    github_trending_repos: 25
    devto_articles: 20
    medium_articles: 20
    arxiv_papers: 15
    stackoverflow_questions: 20
    pypi_packages: 25

  # Database settings
  database:
    path: "landas.db"
    track_history: true
