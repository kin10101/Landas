services:
  # Backend API
  - type: web
    name: landas-backend
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: LANGCHAIN_PROJECT
        value: landas
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/health

  # Frontend (static site - served from global CDN)
  - type: web
    name: landas-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this manually in Render dashboard after backend deploys
      # Value should be: https://landas-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false
